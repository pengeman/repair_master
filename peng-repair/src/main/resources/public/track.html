<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过程记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .track-card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .step-item { border-left: 3px solid #0d6efd; padding-left: 20px; margin-bottom: 25px; position: relative; }
        .step-item::before { content: ''; width: 12px; height: 12px; background: #0d6efd; border-radius: 50%; position: absolute; left: -7.5px; top: 0; }
        .media-box { max-width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .compress-info { font-size: 0.8rem; }
        .status-badge { font-size: 0.8rem; padding: 2px 8px; }
        
        /* 全屏图片查看器 */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .image-modal.active {
            display: flex;
        }
        .modal-image {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
        }
        .modal-close:hover {
            opacity: 1;
        }
        .modal-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        /* 完工弹窗样式 */
        .finish-overlay {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }
        .finish-overlay.active {
            display: flex;
        }
        .finish-modal {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            margin-top: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .finish-modal h5 {
            font-weight: bold;
            margin-bottom: 1.2rem;
        }
        .finish-modal .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 0.8rem;
        }
        .finish-modal .form-control-static {
            background: #f0f0f0;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #555;
        }
        .finish-modal .btn-close-top {
            float: right;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }
        /* 故障分类选择弹窗 */
        .cat-overlay {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
        .cat-overlay.active {
            display: flex;
        }
        .cat-modal {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .cat-modal .form-check {
            padding: 0.5rem 0;
        }
        .cat-modal .form-check-input {
            transform: scale(1.2);
            margin-right: 8px;
        }
        .cat-modal .form-check-label {
            font-size: 1rem;
        }
        #fault_type_display {
            cursor: pointer;
            background: #fff;
        }
        #fault_type_display:focus {
            border-color: #0d6efd;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">← 返回列表</a>
            <span id="hint" class="navbar-text text-white small"></span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="track-card bg-light">
            <h6 class="fw-bold mb-3 text-secondary">状态信息</h6>
            <div class="input-group mb-2">
                <span class="input-group-text">当前状态</span>
                <span id="current_status" class="form-control bg-white"></span>
            </div>
            <div class="input-group mb-2">
                <span class="input-group-text">接单时间</span>
                <span class="form-control bg-white" id="order_time_display"></span>
            </div>
            <div class="input-group mb-2">
                <span class="input-group-text">开始时间</span>
                <span class="form-control bg-white" id="start_time_display">尚未开始</span>
            </div>
        </div>

        <div class="track-card border-top border-primary border-4">
            <h6 class="fw-bold mb-3">新增记录</h6>
            <form id="processForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="small fw-bold">拍照/视频：</label>
                    <input type="file" name="media" id="media_input" class="form-control" accept="image/*,video/*" capture="camera">
                    <small class="text-muted compress-info" id="compress_hint">图片将自动压缩，确保小于300KB</small>
                </div>
                <div class="mb-3">
                    <input type="text" name="desc" id="desc_input" class="form-control" placeholder="简要描述此操作步骤">
                </div>
                <button type="button" id="uploadBtn" class="btn btn-success w-100 fw-bold">点击上传记录</button>
            </form>
        </div>

        <h6 class="fw-bold mb-3 px-2 text-secondary">维修过程</h6>
        <div class="track-card" id="process-list">
            <div class="step-item">
                <small class="text-muted">加载中...</small>
            </div>
        </div>

        <div class="track-card">
            <h6 class="fw-bold mb-3">维修终结</h6>
            <button class="btn btn-outline-secondary btn-sm mb-3" onclick="generateSummary()">智能拼接步骤</button>
            <textarea id="summary-text" class="form-control mb-3" rows="3" placeholder="最终维修结论..."></textarea>
            <button class="btn btn-dark w-100 fw-bold" onclick="openFinishModal()">保存总结并完工</button>
        </div>
    </div>

    <!-- 全屏图片查看器 -->
    <div class="image-modal" id="imageModal">
        <span class="modal-close" onclick="closeImageModal()">&times;</span>
        <img id="modalImage" class="modal-image" src="">
        <div class="modal-hint">点击任意位置关闭</div>
    </div>

    <!-- 完工弹窗 -->
    <div class="finish-overlay" id="finishOverlay" onclick="if(event.target===this)closeFinishModal()">
        <div class="finish-modal">
            <button class="btn-close-top" onclick="closeFinishModal()">&times;</button>
            <h5>维修完工确认</h5>
            <form id="finishForm">
                <label class="form-label">① 返厂原因（故障说明）</label>
                <div class="form-control-static" id="finish_fault_desc"></div>

                <label class="form-label">② 故障原因分析</label>
                <textarea class="form-control" id="finish_fault_reason" rows="2" placeholder="请分析故障原因"></textarea>

                <label class="form-label">③ 故障分类 <small class="text-muted">（点击选择，可多选）</small></label>
                <input type="text" class="form-control" id="fault_type_display" placeholder="点击选择故障分类" readonly onclick="openCategoryModal()">

                <label class="form-label">④ 维修说明</label>
                <textarea class="form-control" id="finish_repair_desc" rows="2" placeholder="维修说明将自动填充"></textarea>

                <label class="form-label">⑤ 维修总结</label>
                <textarea class="form-control" id="finish_summary" rows="2" placeholder="请输入维修总结"></textarea>

                <button type="button" class="btn btn-dark w-100 fw-bold mt-4" onclick="submitFinish()">确认完工</button>
            </form>
        </div>
    </div>

    <!-- 故障分类选择弹窗 -->
    <div class="cat-overlay" id="catOverlay" onclick="if(event.target===this)closeCategoryModal()">
        <div class="cat-modal">
            <h6 class="fw-bold mb-3">选择故障分类（可多选）</h6>
            <div id="categoryList"></div>
            <button class="btn btn-primary w-100 mt-3" onclick="confirmCategorySelection()">确定</button>
        </div>
    </div>

    <script>
        const MAX_SIZE = 300 * 1024;
        const MAX_WIDTH = 1024;
        const INITIAL_QUALITY = 0.8;
        const MIN_QUALITY = 0.5;

        async function compressImage(file) {
            if (!file.type.startsWith('image/')) return file;

            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let quality = INITIAL_QUALITY;
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');

                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = (height * MAX_WIDTH) / width;
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        function tryCompress() {
                            canvas.toBlob(function(blob) {
                                if (blob && blob.size > MAX_SIZE && quality > MIN_QUALITY) {
                                    quality -= 0.1;
                                    canvas.toBlob(function(b) {
                                        blob = b;
                                        if (blob && blob.size > MAX_SIZE && quality > MIN_QUALITY) {
                                            tryCompress();
                                        } else {
                                            resolve(blob);
                                        }
                                    }, 'image/jpeg', quality);
                                } else {
                                    resolve(blob);
                                }
                            }, 'image/jpeg', quality);
                        }

                        tryCompress();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        $(document).ready(function () { 
            begin(); 
            loadProcessHistory();
            
            // 点击模态框任意位置关闭
            document.getElementById('imageModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeImageModal();
                }
            });
        });

        function openImageModal(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function begin() {
            const urlParams = new URLSearchParams(window.location.search);
            const mainId = urlParams.get('id');
            if (mainId) {
                $.get('/api/repair/detailfortrack/' + mainId, function (res) {
                    let data = res.data || {};
                    $('#hint').text(`${data.salename} | ${data.model}`);
                    $('#order_time_display').text(data.order_time || '未知');
                    $('#start_time_display').text(data.start_time || '尚未开始');
                    $('#current_status').text(data.status);
                });
            }
        }

        // 媒体 URL 兼容三种历史数据：完整URL、绝对路径(/开头)、裸文件名
        function buildMediaUrl(item) {
            const f = item.media_file;
             
            if (!f) return '';
            if (f.indexOf('http://') === 0 || f.indexOf('https://') === 0) return f;
            if (f.indexOf('/') === 0) return f;
            let surl =  (item.file_type === 'video' ? '/profile/video/' : '/profile/pics/') + f;
             
            return surl;
        }

        function loadProcessHistory() {
            const urlParams = new URLSearchParams(window.location.search);
            const mainId = urlParams.get('id');
            if (mainId) {
                $.get('/api/repair/repairProcess/' + mainId, function (res) {
                    let processes = (res.data || {}).processes || [];
                    if (processes.length > 0) {
                        let html = '';
                        processes.forEach(function(item) {
                            const mediaUrl = buildMediaUrl(item);
                            html += `
                                <div class="step-item">
                                    <small class="text-muted">${item.record_time}</small>
                                    <p class="fw-medium mt-1">${item.media_desc}</p>
                                    ${mediaUrl ? (item.file_type === 'video' 
                                        ? `<video src="${mediaUrl}" class="media-box" controls></video>` 
                                        : `<img src="${mediaUrl}" class="media-box" onclick="openImageModal(this.src)">`)
                                        : '<small class="text-muted">（无媒体文件）</small>'}
                                </div>
                            `;
                        });
                        $('#process-list').html(html);
                    } else {
                        $('#process-list').html('<div class="step-item"><small class="text-muted">暂无维修记录</small></div>');
                    }
                });
            }
        }

        document.getElementById('media_input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const hint = document.getElementById('compress_hint');
            if (file.type.startsWith('image/')) {
                hint.textContent = '正在压缩图片...';
                const compressed = await compressImage(file);

                if (compressed.size < file.size) {
                    const newFile = new File([compressed], file.name, { type: 'image/jpeg' });
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(newFile);
                    e.target.files = dataTransfer.files;
                    hint.textContent = `压缩完成: ${(compressed.size / 1024).toFixed(1)}KB`;
                } else {
                    hint.textContent = `原图大小: ${(file.size / 1024).toFixed(1)}KB，无需压缩`;
                }
            } else {
                hint.textContent = `视频大小: ${(file.size / 1024).toFixed(1)}KB`;
            }
        });

        document.getElementById('uploadBtn').addEventListener('click', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const mainId = urlParams.get('id');
            const fileInput = document.querySelector('input[name="media"]');
            const descInput = document.querySelector('input[name="desc"]');

            if (!fileInput.files.length || !descInput.value.trim()) return alert("请拍摄并输入描述");

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = '上传中...';

            const formData = new FormData();
            formData.append('media', fileInput.files[0]);
            formData.append('desc', descInput.value);

            fetch(`/api/repair/add-process/${mainId}`, { method: 'POST', body: formData })
                .then(res => {
                    if (res.ok) {
                        descInput.value = '';
                        fileInput.value = '';
                        document.getElementById('compress_hint').textContent = '图片将自动压缩，确保小于300KB';
                        loadProcessHistory();
                        updateStatusDisplay();
                    } else {
                        alert("上传失败");
                    }
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = '点击上传记录';
                });
        });

        function updateStatusDisplay() {
            const urlParams = new URLSearchParams(window.location.search);
            const mainId = urlParams.get('id');
            if (mainId) {
                $.get('/api/repair/detail/' + mainId, function(res) {
                    let data = res.data || {};
                    $('#current_status').text(data.status || '待开始');
                    $('#start_time_display').text(data.start_time || '尚未开始');
                });
            }
        }

        function generateSummary() {
            const steps = document.querySelectorAll('.step-item p');
            let result = "";
            steps.forEach(p => result += p.innerText + "；");
            document.getElementById('summary-text').value = "维修完成。经过：" + result;
        }

        // ===== 完工弹窗相关 =====
        function openFinishModal() {
            const urlParams = new URLSearchParams(window.location.search);
            const mainId = urlParams.get('id');
            if (!mainId) return alert("缺少工单ID");

            // 加载返厂原因
            $.get('/api/repair/detailfortrack/' + mainId, function(res) {
                let data = res.data || {};
                document.getElementById('finish_fault_desc').textContent = data.fault_desc || '无';
            });

            // 加载维修说明（media_desc 集合）
            $.get('/api/repair/repairProcess/' + mainId, function(res) {
                const descs = ((res.data || {}).processes || []).map(p => p.media_desc).filter(Boolean);
                document.getElementById('finish_repair_desc').value = descs.join('；');
            });

            // 把原 summary-text 的值带过来
            const summaryVal = document.getElementById('summary-text').value.trim();
            if (summaryVal) {
                document.getElementById('finish_summary').value = summaryVal;
            }

            document.getElementById('finishOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeFinishModal() {
            document.getElementById('finishOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ===== 故障分类弹窗 =====
        let selectedCategories = [];

        function openCategoryModal() {
            selectedCategories = (document.getElementById('fault_type_display').value || '')
                .split(/[,，\s]+/).filter(Boolean);
            
            fetch('/api/repair/fault-categories')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('categoryList');
                    list.innerHTML = '';
                    data.forEach(cat => {
                        const checked = selectedCategories.includes(cat.name) ? 'checked' : '';
                        list.innerHTML += `
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="${cat.name}" id="cat_${cat.id}" ${checked}>
                                <label class="form-check-label" for="cat_${cat.id}">${cat.name}</label>
                            </div>`;
                    });
                    document.getElementById('catOverlay').classList.add('active');
                });
        }

        function closeCategoryModal() {
            document.getElementById('catOverlay').classList.remove('active');
        }

        function confirmCategorySelection() {
            const checks = document.querySelectorAll('#categoryList .form-check-input:checked');
            const names = Array.from(checks).map(cb => cb.value);
            document.getElementById('fault_type_display').value = names.join('、');
            closeCategoryModal();
        }

        // ===== 提交完工 =====
        function submitFinish() {
            const urlParams = new URLSearchParams(window.location.search);
            const mainId = urlParams.get('id');
            
            const faultReason = document.getElementById('finish_fault_reason').value.trim();
            const faultType = document.getElementById('fault_type_display').value.trim();
            const repairDesc = document.getElementById('finish_repair_desc').value.trim();
            const summary = document.getElementById('finish_summary').value.trim();

            if (!faultReason) return alert('请填写故障原因分析');
            if (!faultType) return alert('请选择故障分类');
            if (!summary) return alert('请填写维修总结');

            if (!confirm('确认保存总结并标记为已完工？')) return;

            const btn = document.querySelector('.finish-modal .btn-dark');
            btn.disabled = true;
            btn.textContent = '保存中...';

            const body = new URLSearchParams();
            body.append('summary', summary);
            body.append('fault_reason', faultReason);
            body.append('fault_type', faultType);
            body.append('repair_desc', repairDesc);

            fetch(`/api/repair/finish/${mainId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString()
            }).then(res => {
                if (res.ok) {
                    alert('已保存总结并完工');
                    window.location.href = 'index.html';
                } else {
                    alert('保存失败');
                }
            }).finally(() => {
                btn.disabled = false;
                btn.textContent = '确认完工';
            });
        }
    </script>
</body>
</html>
