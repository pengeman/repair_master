<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .detail-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; }
        .dispatch-img { width: 100%; max-height: 400px; object-fit: contain; background: #eee; cursor: zoom-in; }
        .info-label { font-size: 0.85rem; color: #6c757d; font-weight: bold; text-transform: uppercase; }
        
        /* 全屏图片查看器 */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .image-modal.active {
            display: flex;
        }
        .modal-image {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
        }
        .modal-close:hover {
            opacity: 1;
        }
        .modal-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container mt-4 pb-5">
        <div class="detail-card">
            <div class="bg-primary p-3 text-white d-flex justify-content-between align-items-center">
                <a href="index.html" class="text-white text-decoration-none fw-bold">← 返回</a>
                <h5 class="mb-0">工单详细信息</h5>
                <span></span>
            </div>
            
            <div class="row g-0">
                <div class="col-md-6 border-end">
                    <div class="p-4">
                        <div class="row g-4">
                            <div class="col-6">
                                <div class="info-label">设备型号</div>
                                <div id="det-model" class="fw-bold">加载中...</div>
                            </div>
                            <div class="col-6">
                                <div class="info-label">设备编号</div>
                                <div id="det-sn" class="fw-bold">加载中...</div>
                            </div>
                            <div class="col-6">
                                <div class="info-label">接单时间</div>
                                <div id="det-order-time" class="small text-muted">-</div>
                            </div>
                            <div class="col-6">
                                <div class="info-label">开始时间</div>
                                <div id="det-start-time" class="small text-success">-</div>
                            </div>
                            <div class="col-12 border-top pt-3">
                                <div class="info-label mb-1">故障说明</div>
                                <p id="det-fault" class="bg-light p-2 rounded small text-secondary">--</p>
                            </div>
                            <div class="col-12">
                                <div class="info-label mb-1">维修说明</div>
                                <p id="repair_desc" class="bg-light p-2 rounded small">--</p>
                            </div>
                            <div class="col-12 border-top pt-3">
                                <div class="info-label mb-1">维修总结</div>
                                <p id="summary_text" class="bg-light p-2 rounded small text-secondary">--</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 bg-light text-center">
                    <div class="p-3">
                        <div class="info-label mb-2">原始派工单照片</div>
                        <img id="det-dispatch-img" src="" class="dispatch-img rounded shadow-sm" onclick="openImageModal(this.src)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 全屏图片查看器 -->
    <div class="image-modal" id="imageModal">
        <span class="modal-close" onclick="closeImageModal()">&times;</span>
        <img id="modalImage" class="modal-image" src="">
        <div class="modal-hint">点击任意位置关闭</div>
    </div>

    <script>
        $(document).ready(function () { 
            loadFullDetail();
            
            // 点击模态框任意位置关闭
            document.getElementById('imageModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeImageModal();
                }
            });
        });
        
        function openImageModal(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // 媒体 URL 兼容三种历史数据：完整URL、绝对路径(/开头)、裸文件名
        function buildMediaUrl(file) {
            if (!file) return '';
            if (file.indexOf('http://') === 0 || file.indexOf('https://') === 0) return file;
            if (file.indexOf('/') === 0) return file;
            return '/profile/pics/' + file;
        }

        function loadFullDetail() {
            const mainId = new URLSearchParams(window.location.search).get('id');
            if (mainId) {
                $.get('/api/repair/detail/' + mainId, function (res) {
                    let data = res.data || {};
                    $('#det-model').text(data.model);
                    $('#det-sn').text(data.sn);
                    $('#det-order-time').text(data.order_time);
                    $('#det-start-time').text(data.start_time || "未开工");
                    $('#det-fault').text(data.fault_desc);
                    $('#repair_desc').text(data.repair_desc);
                    // 维修总结 = 故障原因分析 + 维修总结
                    let parts = [];
                    if (data.fault_reason) parts.push('【故障分析】' + data.fault_reason);
                    if (data.summary) parts.push('【维修总结】' + data.summary);
                    $('#summary_text').text(parts.length ? parts.join('\n') : '--');
                    $('#det-dispatch-img').attr('src', buildMediaUrl(data.dispatch_img));
                });
            }
        }
    </script>
</body>
</html>
