    <th:block th:include="include :: header('维护统计列表')" />

<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>
 <!-- 为 ECharts 准备一个定义了宽高的 DOM -->
  <div id="main" style="width: 100%;height:450px;"></div>
            
<!--            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>-->
        </div>
    </div>
    <th:block th:include="include :: footer" />
     <script type="text/javascript">
      // 基于准备好的dom，初始化echarts实例
      var myChart = echarts.init(document.getElementById('main'));

      // 请求后端统计数据：[{orderTime:"2026-01", withinWarranty:3, outsideWarranty:5}, ...]
      $.ajax({
        url: ctx + "system/equipmentReport/chartData",
        type: 'GET',
        success: function(res) {
          if (res.code != 0) {
            $.modal.alertError(res.msg);
            return;
          }
          var rows = res.data || [];
          // 按月聚合（同一月份可能有多个质量期分组行）
          var monthMap = {};
          var months = [];
          for (var i = 0; i < rows.length; i++) {
            var m = rows[i].orderTime;
            if (!monthMap[m]) {
              monthMap[m] = {within: 0, outside: 0};
              months.push(m);
            }
            monthMap[m].within += rows[i].withinWarranty || 0;
            monthMap[m].outside += rows[i].outsideWarranty || 0;
          }
          months.sort();
          var xData = months;
          var withinData = [], outsideData = [];
          for (var j = 0; j < months.length; j++) {
            withinData.push(monthMap[months[j]].within);
            outsideData.push(monthMap[months[j]].outside);
          }
          // 指定图表的配置项和数据
          var option = {
            title: {
              text: '全年每月设备维修量统计'
            },
            tooltip: {
              trigger: 'axis',
              axisPointer: {
                type: 'shadow'
              }
            },
            legend: {
              data: ['保内维修量', '保外维修量']
            },
            xAxis: {
              type: 'category',
              data: xData
            },
            yAxis: {
              type: 'value',
              minInterval: 1
            },
            series: [
              {
                name: '保内维修量',
                type: 'bar',
                data: withinData
              },
              {
                name: '保外维修量',
                type: 'bar',
                data: outsideData
              }
            ]
          };
          // 使用刚指定的配置项和数据显示图表。
          myChart.setOption(option);
        },
        error: function() {
          $.modal.alertError('统计数据加载失败，请稍后重试');
        }
      });
    </script>
