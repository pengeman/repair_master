<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改工单')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-equipment-edit" th:object="${repairEquipment}" enctype="multipart/form-data">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">业务员：</label>
                    <div class="col-sm-8">
                        <input name="salename" th:field="*{salename}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">客户：</label>
                    <div class="col-sm-8">
                        <input name="client" th:field="*{client}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">客户地址：</label>
                    <div class="col-sm-8">
                        <input name="clientAdd" th:field="*{clientAdd}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">联系人：</label>
                    <div class="col-sm-8">
                        <input name="connection" th:field="*{connection}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">板型：</label>
                    <div class="col-sm-8">
                        <input name="model" th:field="*{model}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">编号：</label>
                    <div class="col-sm-8">
                        <input name="sn" th:field="*{sn}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">设备类型：</label>
                    <div class="col-sm-8">
                        <select name="attribute" th:field="*{attribute}" class="form-control">
                            <option value="0">焊接换热器</option>
                            <option value="1">可拆换热器</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">问题描述：</label>
                    <div class="col-sm-8">
                        <input name="faultDesc" th:field="*{faultDesc}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">质保期：</label>
                    <div class="col-sm-8">
                        <select name="quality" th:field="*{quality}" class="form-control">
                            <option value="1">保内</option>
                            <option value="2">保外</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">工单属性：</label>
                    <div class="col-sm-8">
                        <select name="dispatchProp" th:field="*{dispatchProp}" class="form-control">
                            <option value="1">返厂</option>
                            <option value="2">外派</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">维修描述：</label>
                    <div class="col-sm-8">
                        <input name="repairDesc" th:field="*{repairDesc}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">工单时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="orderTime" th:value="${#dates.format(repairEquipment.orderTime, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text">
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
           
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">工单图片：</label>
                    <div class="col-sm-8">
                        <a href="javascript:;"
                           th:if="${not #strings.isEmpty(repairEquipment.dispatchImg)}"
                           style="margin-right: 15px;"
                           th:data-src="@{'/profile/pics/' + ${repairEquipment.dispatchImg}}"
                           onclick="viewDispatchImg(this.getAttribute('data-src'))">点击查看工单</a>
                        <a href="javascript:;" onclick="$('#dispatchImgFile').click()">修改工单文件</a>
                        <input name="dispatchImgFile" id="dispatchImgFile" type="file" accept="image/*" style="display: none;">
                        <div style="font-size: 12px; color: #999; margin-top: 5px;" id="dispatchImgFileName"></div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/equipment"
        $("#form-equipment-edit").validate({
            focusCleanup: true
        });

        // 弹窗查看工单图片
        function viewDispatchImg(src) {
            layer.photos({
                photos: {
                    title: '工单图片',
                    start: 0,
                    data: [{src: src}]
                },
                anim: 5,
                shade: 0.6
            });
        }

        // 选择新工单图片后显示文件名
        $('#dispatchImgFile').on('change', function() {
            var file = this.files[0];
            if (file) {
                $('#dispatchImgFileName').text('新图片：' + file.name + '（保存后生效）');
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                var formData = new FormData($('#form-equipment-edit')[0]);
                $.ajax({
                    url: prefix + '/edit',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(res) {
                        if (res.code == 0) {
                            $.modal.msgSuccess('保存成功');
                            $.modal.closeAll();
                            $.table.refresh();
                        } else {
                            $.modal.alertError(res.msg);
                        }
                    },
                    error: function() {
                        $.modal.alertError('保存失败，请稍后重试');
                    }
                });
            }
        }

        $("input[name='orderTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("input[name='startTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("input[name='endTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
