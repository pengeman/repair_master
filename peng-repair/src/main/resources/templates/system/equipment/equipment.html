<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('工单维护列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>板型：</label>
                                <input type="text" name="model"/>
                            </li>
                            <li>
                                <label>设备编号：</label>
                                <input type="text" name="sn"/>
                            </li>
                            <li>
                                <label>质保期：</label>
                                <select name="quality">
                                    <option value="">所有</option>
                                    <option value="1">保内</option>
                                    <option value="2">保外</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:equipment:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:equipment:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-info single disabled" onclick="$.operate.detail()" shiro:hasPermission="system:equipment:list">
                    <i class="fa fa-eye"></i> 浏览
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:equipment:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:equipment:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:equipment:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:equipment:remove')}]];
        var prefix = ctx + "system/equipment";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                detailUrl: prefix + "/detail/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "工单维护",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '',
                    visible: false
                },
                {
                    field: 'salename',
                    title: '业务员'
                },
                {
                    field: 'model',
                    title: '板型'
                },
                {
                    field: 'sn',
                    title: '编号'
                },
                {
                    field: 'faultDesc',
                    title: '问题描述'
                },
                {
                    field: 'repairDesc',
                    title: '维修描述'
                },
                {
                    field: 'orderTime',
                    title: '工单时间'
                },
                {
                    field: 'startTime',
                    title: '开工时间'
                },
                {
                    field: 'quality',
                    title: '质保期',
                    formatter: function(value, row, index) {
                        if (value == 1) {
                            return '保内';
                        }
                        if (value == 2) {
                            return '保外';
                        }
                        return value;
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.id + '\')"><i class="fa fa-eye"></i>浏览</a> ');
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
            // 默认隐藏查询栏（可通过工具栏搜索按钮展开/收起）
            $(".search-collapse").hide();
            // 点击行内内容（非按钮/复选框）进入浏览
            $("#bootstrap-table").on("click", "tbody td", function(e) {
                // 排除点击按钮/链接/复选框/输入框等控件
                if ($(e.target).closest("a,button,input,label").length > 0) {
                    return;
                }
                // 排除复选框列整格
                if ($(this).find("input[type='checkbox']").length > 0) {
                    return;
                }
                var row = $("#bootstrap-table").bootstrapTable("getData")[$(this).closest("tr").data("index")];
                if (row && row.id) {
                    $.operate.detail(row.id);
                }
            });
        });
    </script>
</body>
</html>
