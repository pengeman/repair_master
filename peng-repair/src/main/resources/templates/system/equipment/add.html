<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增工单维护')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <div class="toolbar" style="margin-bottom: 10px;">
            <a class="btn btn-primary" onclick="importData()"><i class="fa fa-upload"></i> 导入数据</a>
        </div>
        <form class="form-horizontal m" id="form-equipment-add">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">业务员：</label>
                    <div class="col-sm-8">
                        <input name="salename" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">客户：</label>
                    <div class="col-sm-8">
                        <input name="client" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">客户地址：</label>
                    <div class="col-sm-8">
                        <input name="clientAdd" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">联系人：</label>
                    <div class="col-sm-8">
                        <input name="connection" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">板型：</label>
                    <div class="col-sm-8">
                        <input name="model" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">编号：</label>
                    <div class="col-sm-8">
                        <input name="sn" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">问题描述：</label>
                    <div class="col-sm-8">
                        <input name="faultDesc" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">质保期：</label>
                    <div class="col-sm-8">
                        <input name="quality" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">工单：</label>
                    <div class="col-sm-8">
                        <input name="dispatchImg" class="form-control" type="text">
                    </div>
                </div>
            </div>
            
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">维修描述：</label>
                    <div class="col-sm-8">
                        <input name="repairDesc" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">问题原因：</label>
                    <div class="col-sm-8">
                        <input name="faultReason" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">总结：</label>
                    <div class="col-sm-8">
                        <input name="summary" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">工单时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="orderTime" class="form-control" placeholder="yyyy-MM-dd" type="text">
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">开工时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="startTime" class="form-control" placeholder="yyyy-MM-dd" type="text">
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">结束时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="endTime" class="form-control" placeholder="yyyy-MM-dd" type="text">
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            
            
            
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/equipment"
        $("#form-equipment-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-equipment-add').serialize());
            }
        }

        // 导入工单数据：解析 JSON 后自动填充到下方表单，不提交后端
        function importData() {
            var html = '<div style="padding: 15px;">'
                + '<div class="alert alert-info" style="margin-bottom: 10px;">'
                + '将json格式的工单数据粘贴到文本框里，确认后将自动填入下方表单，可核对修改后再保存</div>'
                + '<textarea id="importDataText" class="form-control" rows="12" placeholder=\'[{"salename":"张三","model":"A板","sn":"SN001","faultDesc":"问题描述","repairDesc":"维修描述","orderTime":"2026-08-01","startTime":"2026-08-02","quality":1,"client":"某公司","clientAdd":"地址","connection":"李四"}]\'></textarea>'
                + '</div>';
            layer.open({
                type: 1,
                title: '导入工单数据',
                area: ['600px', 'auto'],
                content: html,
                btn: ['确定', '取消'],
                yes: function(index, layero) {
                    var data = $('#importDataText').val();
                    if ($.common.isEmpty(data)) {
                        $.modal.alertWarning('请输入要导入的工单数据');
                        return;
                    }
                    var rows;
                    try {
                        rows = JSON.parse(data);
                    } catch (e) {
                        $.modal.alertError('JSON 格式不正确，请检查后重试');
                        return;
                    }
                    if (!$.isArray(rows) || rows.length === 0) {
                        $.modal.alertError('请粘贴 JSON 数组格式的工单数据');
                        return;
                    }
                    var row = rows[0];
                    console.log(row);
                    var fields = ['salename', 'client', 'clientAdd', 'connection', 'model', 'sn', 'faultDesc', 'quality', 'dispatchImg', 'repairDesc', 'faultReason', 'summary', 'orderTime', 'startTime', 'endTime'];
                    var fields_hz = ['创建人','客户','客户地址','联系人','板型','出厂编号','故障描述','质保期','工单','维修描述','故障原因','总结','工单日期','开工日期','结束日期'];
                    for (var i = 0; i < fields_hz.length; i++) {
                        var name_hz = fields_hz[i];
                        var name = fields[i];
                        var value = row[name_hz];
                        if (value !== undefined && value !== null && value !== '') {
                            $("input[name='" + name + "']").val(value);
                        }
                    }
                    layer.close(index);
                    $.modal.msgSuccess('数据已填入表单，请核对后保存');
                }
            });
        }

        $("input[name='orderTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("input[name='startTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("input[name='endTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
