<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('浏览工单维护')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-equipment-detail" th:object="${repairEquipment}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">板型：</label>
                    <div class="col-sm-8">
                        <input th:value="*{model}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">编号：</label>
                    <div class="col-sm-8">
                        <input th:value="*{sn}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">业务员：</label>
                    <div class="col-sm-8">
                        <input th:value="*{salename}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">状态：</label>
                    <div class="col-sm-8">
                        <input th:value="${repairEquipment.status == 1 ? '待开始' : (repairEquipment.status == 2 ? '维修中' : (repairEquipment.status == 3 ? '已完工' : '未知'))}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">质保期：</label>
                    <div class="col-sm-8">
                        <input th:value="${repairEquipment.quality == 1 ? '保内' : (repairEquipment.quality == 2 ? '保外' : '')}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">客户：</label>
                    <div class="col-sm-8">
                        <input th:value="*{client}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">客户地址：</label>
                    <div class="col-sm-8">
                        <input th:value="*{clientAdd}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">联系人：</label>
                    <div class="col-sm-8">
                        <input th:value="*{connection}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">问题描述：</label>
                    <div class="col-sm-8">
                        <input th:value="*{faultDesc}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">维修描述：</label>
                    <div class="col-sm-8">
                        <input th:value="*{repairDesc}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">问题原因：</label>
                    <div class="col-sm-8">
                        <input th:value="*{faultReason}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">总结：</label>
                    <div class="col-sm-8">
                        <input th:value="*{summary}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">工单时间：</label>
                    <div class="col-sm-8">
                        <input th:value="${#dates.format(repairEquipment.orderTime, 'yyyy-MM-dd')}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">开工时间：</label>
                    <div class="col-sm-8">
                        <input th:value="${#dates.format(repairEquipment.startTime, 'yyyy-MM-dd')}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">结束时间：</label>
                    <div class="col-sm-8">
                        <input th:value="${#dates.format(repairEquipment.endTime, 'yyyy-MM-dd')}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12" th:if="${not #strings.isEmpty(repairEquipment.dispatchImg)}">
                <div class="form-group">
                    <label class="col-sm-3 control-label">工单：</label>
                    <div class="col-sm-8">
                        <input th:value="*{dispatchImg}" class="form-control" type="text" readonly>
                        <img class="detail-img" th:src="@{'/profile/' + repairEquipment.dispatchImg}" alt="工单图片" onclick="window.open(this.src)">
                        <div class="img-hint" th:text="${repairEquipment.dispatchImg}"></div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
</body>
</html>
