<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('维修记录')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content">
        <div class="detail-wrap">

            <!-- 无记录提示 -->
            <div class="detail-card" th:if="${#lists.isEmpty(processList)}">
                <div class="detail-card-title"><i class="fa fa-info-circle"></i>维修记录</div>
                <div style="padding: 30px 18px; text-align: center; color: #999;">
                    该工单暂无维修记录
                </div>
            </div>

            <!-- 遍历该工单的所有维修记录 -->
            <div class="detail-card" th:each="record, stat : ${processList}">
                <div class="detail-card-title">
                    <i class="fa fa-clock-o"></i>
                    <span th:text="${#dates.format(record.recordTime, 'yyyy-MM-dd HH:mm:ss')}">-</span>
                    <span style="color:#999; font-weight:normal;">（第 <span th:text="${stat.count}">1</span> 条记录）</span>
                </div>
                <table class="detail-table">
                    <tr>
                        <th>过程描述</th>
                        <td th:text="${record.mediaDesc}">-</td>
                    </tr>
                    <tr th:if="${not #strings.isEmpty(record.mediaFile)}">
                        <th>过程图片</th>
                        <td>
                            <img class="detail-img" th:src="${record.mediaFile}" th:attr="data-type=${record.fileType}" alt="过程图片" onclick="window.open(this.src)">
                        </td>
                    </tr>
                </table>
            </div>

        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script>
        // 媒体 URL 兼容三种历史数据：完整URL(http开头)、绝对路径(/开头)、裸文件名(手机端上传)
        $(function() {
            $('.detail-img').each(function() {
                var f = $(this).attr('src'); // 原始属性值，避免用 this.src（已被浏览器解析成完整URL）
                if (!f) return;
                if (f.indexOf('http') === 0) return; // 完整URL，直接使用
                if (f.indexOf('/') === 0) return;    // 绝对路径，直接使用
                var dir = ($(this).attr('data-type') === 'video') ? '/profile/video/' : '/profile/pics/';
                this.src = dir + f;                  // 裸文件名，补前缀
            });
        });
    </script>
</body>
</html>
