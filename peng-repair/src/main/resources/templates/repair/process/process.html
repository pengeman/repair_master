<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('维修过程列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="repair:process:add">
                    <i class="fa fa-plus"></i> 过程记录
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="repair:process:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
<!--                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="repair:process:remove">
                    <i class="fa fa-remove"></i> 删除-->
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="repair:process:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('repair:process:edit')}]];
        var removeFlag = [[${@permission.hasPermi('repair:process:remove')}]];
        var prefix = ctx + "repair/process";

        $(function() {
            var options = {
                url: prefix + "/list",
                viewUrl: prefix + "/view/{id}",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "维修过程",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '',
                    visible: false
                },
                {
                    field: 'model',
                    title: '板型'
                },
                {
                    field: 'sn',
                    title: '编号'
                },
                {
                    field: 'faultDesc',
                    title: '问题描述'
                },
                {
                    field: 'repairDesc',
                    title: '维修描述'
                },
                {
                    field: 'orderTime',
                    title: '工单时间'
                },
                {
                    field: 'startTime',
                    title: '开工时间'
                },
                {
                    field: 'salename',
                    title: '业务员'
                },
                {
                    field: 'status',
                    title: '状态',
                    formatter: function(value, row, index) {
                        if (value == 1) {
                            return '待开始';
                        }
                        if (value == 2) {
                            return '维修中';
                        }
                        if (value == 3) {
                            return '已完工';
                        }
                        return value;
                    }
                },
                {
                    field: 'quality',
                    title: '质保期',
                    formatter: function(value, row, index) {
                        if (value == 1) {
                            return '保内';
                        }
                        if (value == 2) {
                            return '保外';
                        }
                        return value;
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="$.modal.open(\'新增维修过程\', \'' + prefix + '/add?mainId=' + row.id + '\')"><i class="fa fa-plus"></i>过程记录</a> ');
                        actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.view(\'' + row.id + '\')"><i class="fa fa-eye"></i>查看</a> ');
//                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
//                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }
            ]
            };
            $.table.init(options);
            // 默认隐藏查询栏（可通过工具栏搜索按钮展开/收起）
            $(".search-collapse").hide();
        });
    </script>
</body>
</html>
