<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('维修过程列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="addProcess()" shiro:hasPermission="repair:process:add">
                    <i class="fa fa-plus"></i> 过程记录
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.view()" shiro:hasPermission="repair:process:edit">
                    <i class="fa fa-edit"></i> 查看
                </a>
<!--                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="repair:process:remove">
                    <i class="fa fa-remove"></i> 删除-->
                </a>
<!--                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="repair:process:export">
                    <i class="fa fa-download"></i> 导出
                </a>-->
                <a class="btn btn-warning" onclick="openFinishModal()">
                    <i class="fa fa-check-circle"></i> 维修完结
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('repair:process:edit')}]];
        var removeFlag = [[${@permission.hasPermi('repair:process:remove')}]];
        var prefix = ctx + "repair/process";

        // 工具栏「过程记录」：选中一行后带 mainId 打开新增弹窗
        function addProcess() {
            var ids = $.table.selectFirstColumns();
            if (ids.length == 0) {
                $.modal.alertWarning("请至少选择一条记录");
                return;
            }
            $.modal.open('新增维修过程', prefix + '/add?mainId=' + ids[0]);
        }

        // 打开「维修完结」弹窗：必须先选中工单，选中后带 mainId 打开 finish.html
        function openFinishModal() {
            var ids = $.table.selectFirstColumns();
            if (ids.length == 0) {
                $.modal.alertWarning("请先选择要完结的工单");
                return;
            }
            $.modal.open('维修完结', prefix + '/finish?mainId=' + ids[0]);
        }

        // 故障原因选择弹窗（数据源待接入，先给示例选项）
        function openCauseModal() {
            var causes = ['配件损坏', '密封失效', '腐蚀', '机械疲劳', '异物侵入', '其他'];
            var html = '<div style="padding: 15px;">';
            for (var i = 0; i < causes.length; i++) {
                html += '<a class="btn btn-default btn-block m-b-xs" href="javascript:void(0)" onclick="selectCause(\'' + causes[i] + '\')">' + causes[i] + '</a>';
            }
            html += '</div>';
            layer.open({
                type: 1,
                title: '选择故障原因',
                area: ['300px', 'auto'],
                content: html
            });
        }

        function selectCause(val) {
            $('#finish_fault_reason').val(val);
            layer.closeAll();
        }

        // 故障分类多选弹窗（数据源为 fault_categories 表，先给示例选项）
        function openCategoryModal() {
            var cats = ['侵蚀', '化学腐蚀', '垢下腐蚀', '应力腐蚀', '机械冲击', '机械疲劳', '材料质量', '漏点腐蚀', '热应力冲击', '其他'];
            var html = '<div style="padding: 15px;">';
            for (var i = 0; i < cats.length; i++) {
                html += '<label class="checkbox-inline m-r-sm m-b-xs"><input type="checkbox" class="category-check" value="' + cats[i] + '"> ' + cats[i] + '</label>';
                if ((i + 1) % 3 == 0) {
                    html += '<br>';
                }
            }
            html += '<br><button type="button" class="btn btn-success btn-block" onclick="selectCategories()">确定</button>';
            html += '</div>';
            layer.open({
                type: 1,
                title: '选择故障分类（可多选）',
                area: ['380px', 'auto'],
                content: html
            });
        }

        function selectCategories() {
            var arr = [];
            $('.category-check:checked').each(function() {
                arr.push($(this).val());
            });
            $('#fault_type_display').val(arr.join('、'));
            layer.closeAll();
        }

        // 确认完工提交
        function submitFinish() {
            var faultReason = $('#finish_fault_reason').val();
            var category = $('#fault_type_display').val();
            var summary = $('#finish_summary').val();
            if ($.common.isEmpty(faultReason)) {
                $.modal.alertWarning('请选择故障原因');
                return;
            }
            if ($.common.isEmpty(category)) {
                $.modal.alertWarning('请选择故障分类');
                return;
            }
            if ($.common.isEmpty(summary)) {
                $.modal.alertWarning('请输入维修总结');
                return;
            }
            $.modal.confirm('确认该工单维修完结？', function() {
                // TODO: 提交后端保存
                $.modal.msgSuccess('维修完结提交成功');
                layer.closeAll();
            });
        }

        $(function() {
            var options = {
                url: prefix + "/list",
                viewUrl: prefix + "/view/{id}",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "维修过程",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '',
                    visible: false
                },
                {
                    field: 'model',
                    title: '板型'
                },
                {
                    field: 'sn',
                    title: '编号'
                },
                {
                    field: 'faultDesc',
                    title: '问题描述'
                },
                {
                    field: 'repairDesc',
                    title: '维修描述'
                },
                {
                    field: 'orderTime',
                    title: '工单时间'
                },
                {
                    field: 'startTime',
                    title: '开工时间'
                },
                {
                    field: 'salename',
                    title: '业务员'
                },
                {
                    field: 'status',
                    title: '状态',
                    formatter: function(value, row, index) {
                        if (value == 1) {
                            return '待开始';
                        }
                        if (value == 2) {
                            return '维修中';
                        }
                        if (value == 3) {
                            return '已完工';
                        }
                        return value;
                    }
                },
                {
                    field: 'quality',
                    title: '质保期',
                    formatter: function(value, row, index) {
                        if (value == 1) {
                            return '保内';
                        }
                        if (value == 2) {
                            return '保外';
                        }
                        return value;
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="$.modal.open(\'新增维修过程\', \'' + prefix + '/add?mainId=' + row.id + '\')"><i class="fa fa-plus"></i>过程记录</a> ');
                        actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.view(\'' + row.id + '\')"><i class="fa fa-eye"></i>查看</a> ');
//                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
//                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }
            ]
            };
            $.table.init(options);
            // 默认隐藏查询栏（可通过工具栏搜索按钮展开/收起）
            $(".search-collapse").hide();
        });
    </script>
</body>
</html>
