<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('维修完结')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content">
        <form id="finishForm" style="padding: 0 15px;">
            <label class="form-label">① 返厂原因（故障说明）</label>
            <div class="form-control-static finish-static" id="finish_fault_desc" th:text="${repairEquipment.faultDesc}">有外露，检查是否有内容，修好处打压检测报告</div>

            <label class="form-label">② 故障原因分析</label>
            <input type="text" class="form-control" id="finish_fault_reason" placeholder="点击选择故障原因" readonly="" onclick="openCauseModal()">
            <input type="hidden" id="finish_fault_reason_id">

            <label class="form-label">③ 原因描述</label>
            <textarea class="form-control" id="finish_cause_desc" rows="2" placeholder="请输入详细原因描述"></textarea>

            <label class="form-label">④ 故障分类 <small class="text-muted">（点击选择，可多选）</small></label>
            <input type="text" class="form-control" id="fault_type_display" placeholder="点击选择故障分类" readonly="" onclick="openCategoryModal()">

            <label class="form-label">⑤ 维修说明</label>
            <textarea class="form-control" id="finish_repair_desc" rows="2" placeholder="维修说明将自动填充"></textarea>

            <label class="form-label">⑥ 维修总结</label>
            <textarea class="form-control" id="finish_summary" rows="3" placeholder="可点击下方「生成总结」自动生成，也可手动输入"></textarea>

            <button type="button" class="btn btn-info btn-block m-b-sm" onclick="genSummary()">生成总结</button>
            <button type="button" class="btn btn-success btn-block" onclick="submitFinish()">确认完工</button>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "repair/process";
        var mainId = [[${mainId}]];
        // ② 故障原因分析选项：来自 fault_categories 表（name 字段）
        var faultReasons = [[${categoryList}]];
        // ④ 故障分类选项：来自 fault_cause 表（cause 字段）
        var faultTypes = [[${causeList}]];
        // 选中的故障分类 id 列表（多选）
        var selectedFaultTypeIds = [];

        // 故障原因选择弹窗（数据源 fault_categories 表）
        function openCauseModal() {
            var html = '<div style="padding: 15px;">';
            for (var i = 0; i < faultReasons.length; i++) {
                html += '<a class="btn btn-default btn-block m-b-xs" href="javascript:void(0)" onclick="selectCause(' + faultReasons[i].id + ', \'' + faultReasons[i].name + '\')">' + faultReasons[i].name + '</a>';
            }
            html += '</div>';
            layer.open({
                type: 1,
                title: '选择故障原因',
                area: ['300px', 'auto'],
                content: html
            });
        }

        function selectCause(id, name) {
            $('#finish_fault_reason').val(name);
            $('#finish_fault_reason_id').val(id);
            layer.closeAll();
        }

        // 故障分类多选弹窗（数据源 fault_cause 表）
        function openCategoryModal() {
            var html = '<div style="padding: 15px;">';
            for (var i = 0; i < faultTypes.length; i++) {
                html += '<label class="checkbox-inline m-r-sm m-b-xs"><input type="checkbox" class="category-check" data-id="' + faultTypes[i].id + '" value="' + faultTypes[i].cause + '"> ' + faultTypes[i].cause + '</label>';
                if ((i + 1) % 3 == 0) {
                    html += '<br>';
                }
            }
            html += '<br><button type="button" class="btn btn-success btn-block" onclick="selectCategories()">确定</button>';
            html += '</div>';
            layer.open({
                type: 1,
                title: '选择故障分类（可多选）',
                area: ['380px', 'auto'],
                content: html
            });
        }

        function selectCategories() {
            var names = [];
            selectedFaultTypeIds = [];
            $('.category-check:checked').each(function() {
                names.push($(this).val());
                selectedFaultTypeIds.push($(this).data('id'));
            });
            $('#fault_type_display').val(names.join('、'));
            layer.closeAll();
        }

        // 生成维修分析总结：串联该工单的维修过程记录
        function genSummary() {
            if (mainId == null || mainId == '') {
                $.modal.alertWarning('缺少工单参数');
                return;
            }
            $.ajax({
                type: 'get',
                url: prefix + '/genSummary?mainId=' + mainId,
                success: function(res) {
                    if (res.code == web_status.SUCCESS) {
                        $('#finish_summary').val(res.data);
                        $.modal.msgSuccess('总结生成成功，可编辑后提交');
                    } else {
                        $.modal.alertError(res.msg);
                    }
                },
                error: function() {
                    $.modal.alertError('生成失败，请稍后重试');
                }
            });
        }

        // 确认完工提交
        function submitFinish() {
            var faultReason = $('#finish_fault_reason').val();
            var category = $('#fault_type_display').val();
            var summary = $('#finish_summary').val();
            if ($.common.isEmpty(faultReason)) {
                $.modal.alertWarning('请选择故障原因');
                return;
            }
            if ($.common.isEmpty(category)) {
                $.modal.alertWarning('请选择故障分类');
                return;
            }
            if ($.common.isEmpty(summary)) {
                $.modal.alertWarning('请输入维修总结');
                return;
            }
            $.modal.confirm('确认该工单维修完结？', function() {
                var data = {
                    id: mainId,
                    faultReason: $('#finish_fault_desc').text(),            // 返厂原因（工单问题描述）
                    faultCauseId: $('#finish_fault_reason_id').val(),       // 故障原因id
                    faultType: selectedFaultTypeIds.length > 0 ? selectedFaultTypeIds[0] : '', // 故障分类(第一个)
                    faultTypeDesc: $('#fault_type_display').val(),          // 故障分类文本
                    causeDesc: $('#finish_cause_desc').val(),
                    repairDesc: $('#finish_repair_desc').val(),
                    summary: $('#finish_summary').val()
                };
                $.ajax({
                    type: 'post',
                    url: prefix + '/finishSave',
                    data: data,
                    success: function(res) {
                        if (res.code == web_status.SUCCESS) {
                            $.modal.msgSuccess('维修完结提交成功');
                            layer.closeAll();
                        } else {
                            $.modal.alertError(res.msg);
                        }
                    },
                    error: function() {
                        $.modal.alertError('提交失败，请稍后重试');
                    }
                });
            });
        }
    </script>
</body>
</html>
