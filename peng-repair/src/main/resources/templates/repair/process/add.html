<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增维修过程')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-process-add">
            <!-- 显示主表id , 隐藏-->
            <input type="hidden" name="mainId" th:value="${mainId}">
            <div th:if="${repairEquipment != null}"><!-- 工单数据提示 -->
                <div class="col-xs-12">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">工单信息：</label>
                        <div class="col-sm-8 compact-info">
                            <span><b th:text="${repairEquipment.salename}">-</b></span>
                            <span><b th:text="${repairEquipment.model}">-</b></span>
                            <span><b th:text="${repairEquipment.sn}">-</b></span>
<!--                            <span>接单时间：<b th:text="${#dates.format(repairEquipment.orderTime, 'yyyy-MM-dd')}">-</b></span>-->
<br/>
                            <span>开始时间：<b th:text="${#dates.format(repairEquipment.startTime, 'yyyy-MM-dd')}">-</b></span>
                            <span><b th:text="${repairEquipment.quality == 1 ? '保内' : (repairEquipment.quality == 2 ? '保外' : '')}">-</b></span>
                        </div>
                    </div>
                </div>
            </div>
            <div>新增记录</div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">过程图片：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="mediaFile">
                        <div class="file-loading">
                            <input class="form-control file-upload" id="mediaFile" name="file" type="file"><!-- 选择图片，选择完成自动上传，显示传输过程 -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">过程描述：</label>
                    <div class="col-sm-8">
                        <input name="mediaDesc" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">记录时间：</label><!-- 只读，当前时间 -->
                    <div class="col-sm-8">
                        <input name="recordTime" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <th:block th:include="include :: bootstrap-fileinput-js"/>
    <script th:inline="javascript">
        var prefix = ctx + "repair/process"
        $("#form-process-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-process-add').serialize());
            }
        }

        // 记录时间：只读，默认当前时间（日时分秒）
        function pad(num) {
            return num < 10 ? '0' + num : '' + num;
        }
        var now = new Date();
        $("input[name='recordTime']").val(now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
            + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()));

        // 过程图片：选择完成自动上传，显示传输过程
        $(".file-upload").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true,
            showUpload: false,
            showProgress: true,
            uploadAsync: true
        }).on('filebatchselected', function (event, data) {
            $(this).fileinput('upload');
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
    </script>
</body>
</html>
