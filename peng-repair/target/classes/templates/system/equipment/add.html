<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增工单维护')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-equipment-add" enctype="multipart/form-data">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-2 control-label">业务员：</label>
                    <div class="col-sm-10">
                        <input name="salename" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">型号：</label>
                    <div class="col-sm-8">
                        <input name="model" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">编号：</label>
                    <div class="col-sm-8">
                        <input name="sn" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">派工单：</label>
                    <div class="col-sm-8">
                        <input name="dispatchImgFile" class="form-control" type="file">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">问题描述：</label>
                    <div class="col-sm-8">
                        <input name="faultDesc" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">维修描述：</label>
                    <div class="col-sm-8">
                        <input name="repairDesc" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">工单时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="orderTime" class="form-control" placeholder="yyyy-MM-dd" type="text" readonly>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = /*[[@{/system/equipment}]]*/"/system/equipment"
        // 自动填写当前日期
        $(function() {
            var now = new Date();
            var y = now.getFullYear();
            var m = ('0' + (now.getMonth() + 1)).slice(-2);
            var d = ('0' + now.getDate()).slice(-2);
            $("input[name='orderTime']").val(y + '-' + m + '-' + d);
        });

        $("#form-equipment-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var formData = new FormData($("#form-equipment-add")[0]);
                console.log(prefix + "/add");
                console.log(prefix + "/add");
                $.ajax({
                    url: prefix + "/add",
                    type: "post",
                    data: formData,
                    cache: false,
                    processData: false,
                    contentType: false,
                    success: function(result) {
                        $.operate.successCallback(result);
                    }
                });
            }
        }
    </script>
</body>
</html>
